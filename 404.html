  <style>
    .error-page{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:72px 20px 130px;background:radial-gradient(circle at 50% 18%,rgba(49,88,243,.12),transparent 38%),linear-gradient(180deg,#fff,#f7f9fc)}

    .error-card h1{font-size:clamp(34px,6vw,54px);line-height:1.1;letter-spacing:-2px;margin:22px 0 12px}
    .error-card p{max-width:540px;margin:auto;color:#65738a;font-size:15px}
    .error-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px}

  <header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">☁</span><strong>Cloud<span>VPS</span></strong></a><a class="btn btn-small" href="contact.html">Liên hệ hỗ trợ</a></div></header>

      <div class="error-actions"><a class="btn" href="index.html">Về trang chủ →</a><a class="btn btn-ghost" href="vps.html">Xem VPS</a><a class="btn btn-ghost" href="proxy.html">Xem Proxy</a></div>
